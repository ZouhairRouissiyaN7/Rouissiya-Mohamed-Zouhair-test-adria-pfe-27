server.port=8083

spring.ai.model.chat=ollama
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}

spring.ai.ollama.chat.options.model=llama3:latest
spring.ai.ollama.chat.options.format=json
spring.ai.ollama.chat.options.temperature=0.1
spring.ai.ollama.chat.options.num-ctx=4096

spring.ai.ollama.init.pull-model-strategy=never

spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=chat-mcp-client
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.request-timeout=60s

spring.ai.mcp.client.sse.connections.account.url=${ACCOUNT_SERVICE_URL:http://localhost:8082}
spring.ai.mcp.client.sse.connections.account.sse-endpoint=/api/accounts/mcp/sse
spring.ai.mcp.client.sse.connections.transaction.url=${TRANSACTION_SERVICE_URL:http://localhost:8081}
spring.ai.mcp.client.sse.connections.transaction.sse-endpoint=/api/transactions/mcp/sse

app.agent.max-steps=5

app.discord.enabled=${DISCORD_ENABLED:false}
app.discord.token=${DISCORD_BOT_TOKEN:}
app.discord.guild-id=${DISCORD_GUILD_ID:}
app.discord.bank-username=${DISCORD_BANK_USERNAME:customer1}
app.discord.bank-password=${DISCORD_BANK_PASSWORD:}
app.discord.token-uri=http://${KEYCLOAK_HOST:localhost}:8080/realms/adria-bank/protocol/openid-connect/token
app.discord.client-id=bank-app

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
