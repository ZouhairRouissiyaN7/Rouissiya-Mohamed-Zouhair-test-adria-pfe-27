server.port=8082

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/account_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:adria}
spring.datasource.password=${DB_PASSWORD:adria}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

spring.graphql.path=/api/accounts/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/api/accounts/graphiql

spring.ai.mcp.server.name=account-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-endpoint=/api/accounts/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/api/accounts/mcp/message

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
