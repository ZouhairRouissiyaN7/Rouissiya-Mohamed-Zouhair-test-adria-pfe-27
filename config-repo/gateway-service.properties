server.port=8888

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=account-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/accounts/**

spring.cloud.gateway.server.webflux.routes[1].id=transaction-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://transaction-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/transactions/**

spring.cloud.gateway.server.webflux.routes[2].id=chat-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://chat-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/chat,/api/chat/**

spring.cloud.gateway.server.webflux.routes[3].id=account-openapi
spring.cloud.gateway.server.webflux.routes[3].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs/account/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[4].id=transaction-openapi
spring.cloud.gateway.server.webflux.routes[4].uri=lb://transaction-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/docs/transaction/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=2

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Account Service
springdoc.swagger-ui.urls[0].url=/docs/account/v3/api-docs
springdoc.swagger-ui.urls[1].name=Transaction Service
springdoc.swagger-ui.urls[1].url=/docs/transaction/v3/api-docs
springdoc.swagger-ui.urlsPrimaryName=Account Service
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

management.endpoint.gateway.access=read-only
management.endpoints.web.exposure.include=health,info,gateway
