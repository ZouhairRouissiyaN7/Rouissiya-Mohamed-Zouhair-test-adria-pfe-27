eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*

app.security.jwt.issuer=http://localhost:8080/realms/adria-bank
app.security.jwt.audience=bank-api
app.security.jwt.jwk-set-uri=http://${KEYCLOAK_HOST:localhost}:8080/realms/adria-bank/protocol/openid-connect/certs

bank.transaction.max-amount=1000
