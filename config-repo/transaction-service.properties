server.port=8081

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/transaction_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:adria}
spring.datasource.password=${DB_PASSWORD:adria}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=5000

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

spring.graphql.path=/api/transactions/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/api/transactions/graphiql

spring.ai.mcp.server.name=transaction-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-endpoint=/api/transactions/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/api/transactions/mcp/message

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.alphanumeric-ids.enabled=true

resilience4j.circuitbreaker.configs.accountClient.ignoreExceptions[0]=feign.FeignException$NotFound
resilience4j.circuitbreaker.configs.accountClient.ignoreExceptions[1]=feign.FeignException$Unauthorized
resilience4j.circuitbreaker.configs.accountClient.ignoreExceptions[2]=feign.FeignException$Forbidden
resilience4j.circuitbreaker.configs.accountClient.ignoreExceptions[3]=feign.FeignException$Conflict
resilience4j.circuitbreaker.configs.accountClient.ignoreExceptions[4]=feign.FeignException$BadRequest
resilience4j.circuitbreaker.configs.accountClient.ignoreExceptions[5]=feign.FeignException$UnprocessableEntity

resilience4j.circuitbreaker.configs.accountClient.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.accountClient.slidingWindowSize=4
resilience4j.circuitbreaker.configs.accountClient.minimumNumberOfCalls=4

resilience4j.circuitbreaker.configs.accountClient.failureRateThreshold=50

resilience4j.circuitbreaker.configs.accountClient.waitDurationInOpenState=15s
resilience4j.circuitbreaker.configs.accountClient.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.accountClient.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.configs.accountClient.registerHealthIndicator=false

resilience4j.circuitbreaker.instances.AccountClientgetAccountUUIDString.baseConfig=accountClient
resilience4j.circuitbreaker.instances.AccountClientapplyBalanceChangeUUIDBalanceChangeRequestString.baseConfig=accountClient

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=3000
