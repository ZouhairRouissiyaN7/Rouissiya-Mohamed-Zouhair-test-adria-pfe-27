spring.application.name=chat-service
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.ai.model.chat=ollama
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.toolcallback.enabled=false
app.security.jwt.issuer=http://localhost:8180/realms/adria-bank
app.security.jwt.audience=bank-api
app.security.jwt.jwk-set-uri=http://localhost:8180/realms/adria-bank/protocol/openid-connect/certs
