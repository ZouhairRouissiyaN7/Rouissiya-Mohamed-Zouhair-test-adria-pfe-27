spring.application.name=transaction-service
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.datasource.url=jdbc:h2:mem:transaction;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.auto-create=false
bank.transaction.max-amount=1000
app.security.jwt.issuer=http://localhost:8180/realms/adria-bank
app.security.jwt.audience=bank-api
app.security.jwt.jwk-set-uri=http://localhost:8180/realms/adria-bank/protocol/openid-connect/certs
